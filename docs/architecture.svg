<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>AWS Platform Lab architecture</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5f6b7a"/></marker></defs>
<rect width="1200" height="860" fill="#ffffff"/>
<text x="30" y="40" font-size="22" font-weight="bold" fill="#1f2933" text-anchor="start">AWS Platform Lab architecture</text>
<text x="30" y="66" font-size="13" font-weight="normal" fill="#52606d" text-anchor="start">Only the load balancer faces the internet. Servers and database are private, and everything is built with Terraform.</text>
<rect x="30" y="195" width="180" height="56" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="120.0" y="219" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Internet users</text>
<rect x="30" y="560" width="180" height="92" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="120.0" y="584" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">GitHub Actions</text>
<text x="120.0" y="604" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">OIDC, no stored keys</text>
<text x="120.0" y="622" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">plan on pull request</text>
<text x="120.0" y="640" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">apply on merge to main</text>
<rect x="240" y="92" width="930" height="748" rx="12" fill="#f7f9fb" stroke="#7b8794" stroke-width="1.4"/>
<text x="260" y="118" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="start">AWS Organizations  ·  workloads account  ·  us-east-2</text>
<text x="260" y="138" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start">SCPs: deny all other regions  ·  no one can disable CloudTrail, Config, GuardDuty, or Security Hub</text>
<rect x="260" y="156" width="600" height="560" rx="10" fill="#ffffff" stroke="#7b8794" stroke-width="1.4"/>
<text x="278" y="180" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="start">VPC 10.0.0.0/16  ·  two availability zones</text>
<rect x="280" y="194" width="560" height="104" rx="8" fill="#eef4fd" stroke="#a9c1ea" stroke-width="1"/>
<text x="296" y="214" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start">Public subnets</text>
<rect x="440" y="224" width="240" height="60" rx="8" fill="#ffffff" stroke="#2f6fde" stroke-width="2"/>
<text x="560.0" y="248" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Application Load Balancer</text>
<text x="560.0" y="268" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">HTTP 80 from the internet</text>
<rect x="280" y="318" width="560" height="382" rx="8" fill="#f3f5f7" stroke="#c4ccd4" stroke-width="1"/>
<text x="296" y="338" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start">Private subnets (no public IPs)</text>
<rect x="300" y="350" width="520" height="152" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="6 4"/>
<text x="316" y="370" font-size="12" font-weight="bold" fill="#323f4b" text-anchor="start">Auto Scaling group  ·  self-healing</text>
<rect x="320" y="382" width="230" height="104" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="435.0" y="406" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">EC2  ·  us-east-2a</text>
<text x="435.0" y="426" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">Flask app on port 8080</text>
<text x="435.0" y="444" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">IMDSv2 required, no SSH key</text>
<text x="435.0" y="462" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">encrypted disk</text>
<rect x="570" y="382" width="230" height="104" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="685.0" y="406" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">EC2  ·  us-east-2b</text>
<text x="685.0" y="426" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">Flask app on port 8080</text>
<text x="685.0" y="444" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">IMDSv2 required, no SSH key</text>
<text x="685.0" y="462" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">encrypted disk</text>
<rect x="300" y="528" width="250" height="84" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="425.0" y="552" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">RDS PostgreSQL</text>
<text x="425.0" y="572" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">encrypted, private only</text>
<text x="425.0" y="590" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">accepts 5432 from app tier only</text>
<rect x="570" y="528" width="250" height="84" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="695.0" y="552" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">VPC endpoints</text>
<text x="695.0" y="572" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">S3 gateway, Systems Manager,</text>
<text x="695.0" y="590" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">Secrets Manager (no NAT Gateway)</text>
<text x="300" y="646" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start">Access: Session Manager only  ·  Patching: Patch Manager, weekly window</text>
<text x="300" y="666" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start">VPC Flow Logs to CloudWatch  ·  each security group allows only the tier in front of it</text>
<rect x="890" y="156" width="260" height="128" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="1020.0" y="180" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Security and compliance</text>
<text x="1020.0" y="200" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">CloudTrail, all regions</text>
<text x="1020.0" y="218" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">AWS Config, 8 rules</text>
<text x="1020.0" y="236" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">GuardDuty</text>
<text x="1020.0" y="254" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">Security Hub CSPM</text>
<rect x="890" y="302" width="260" height="92" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="1020.0" y="326" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Monitoring</text>
<text x="1020.0" y="346" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">CloudWatch dashboard</text>
<text x="1020.0" y="364" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">7 alarms → SNS email</text>
<rect x="890" y="412" width="260" height="110" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="1020.0" y="436" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">AWS Backup</text>
<text x="1020.0" y="456" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">daily RDS backups, 7 days</text>
<text x="1020.0" y="474" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">vault outlives the nightly</text>
<text x="1020.0" y="492" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">teardown of infra/</text>
<rect x="890" y="540" width="260" height="92" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="1020.0" y="564" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Secrets Manager</text>
<text x="1020.0" y="584" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">RDS-managed database password,</text>
<text x="1020.0" y="602" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">read by the app at runtime</text>
<rect x="890" y="650" width="260" height="110" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="1020.0" y="674" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">S3</text>
<text x="1020.0" y="694" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">Terraform state (management account)</text>
<text x="1020.0" y="712" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">app package, log buckets</text>
<text x="1020.0" y="730" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">all encrypted, public access blocked</text>
<path d="M210 223 H330 V254 H440" fill="none" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="213" y="214" font-size="11" font-weight="normal" fill="#52606d" text-anchor="start">HTTP</text>
<path d="M540 284 V382" fill="none" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M640 284 V326 H700 V382" fill="none" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="708" y="346" font-size="11" font-weight="normal" fill="#52606d" text-anchor="start">8080</text>
<path d="M425 486 V528" fill="none" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="432" y="512" font-size="11" font-weight="normal" fill="#52606d" text-anchor="start">5432</text>
<path d="M695 486 V528" fill="none" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="702" y="512" font-size="11" font-weight="normal" fill="#52606d" text-anchor="start">443</text>
<path d="M210 606 H260" fill="none" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="120" y="672" font-size="11" font-weight="normal" fill="#52606d" text-anchor="middle">deploys via Terraform</text>
<path d="M890 220 H860" fill="none" stroke="#5f6b7a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<path d="M890 348 H860" fill="none" stroke="#5f6b7a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<path d="M890 467 H860" fill="none" stroke="#5f6b7a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<path d="M890 586 H860" fill="none" stroke="#5f6b7a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="1160" y="820" font-size="11" font-weight="normal" fill="#7b8794" text-anchor="end">Dashed lines: account-wide services watching, protecting, or backing up the VPC</text>
</svg>